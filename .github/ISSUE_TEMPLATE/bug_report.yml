name: Bug report
description: Something isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real patient data. Use synthetic codes.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - Streamable HTTP (/mcp)
        - HTTP+SSE (/sse)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you observe?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The exact tool call (JSON) or curl command, with synthetic codes.
      render: json
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      render: shell
    validations:
      required: false
